<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">01  把外部工具接到已有的 Agent</title><desc id="desc">MCP 工具发现时从 Driver 返回声明，转换为 ToolSpec；执行时从 Agent 向 Driver 传递名称参数，再把多模态结果送回。</desc>
