[project]
name = "comma-mini-agent"
version = "0.1.0"
description = "从 LLM API 到本机 Computer Use 的课堂实验框架"
requires-python = ">=3.12"
dependencies = ["starlette>=1.7,<2", "uvicorn>=0.54,<1", "httpx>=0.28,<0.29", "mcp>=1.20,<2", "python-dotenv>=1.1,<2", "jsonschema>=4.26,<5"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "pillow>=11,<12"]

[project.scripts]
mini-agent = "common.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "lesson_01_llm", "lesson_02_agent", "lesson_03_computer_use"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls a paid model API (opt in)", "desktop: controls the local desktop (opt in)"]
